site_name: MAS-Sentry Toolkit
site_description: Unified offensive-security toolkit for Multi-Agent Systems
site_url: https://evkir.github.io/mas-sentry-toolkit/
repo_url: https://github.com/evkir/mas-sentry-toolkit
repo_name: evkir/mas-sentry-toolkit
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Methodology:
      - ABFP: methodology/ABFP.md
      - Indirect Prompt Injection: methodology/indirect-prompt-injection.md
      - Transitive Injection Propagation: methodology/transitive-injection-propagation.md
      - Consume-Edge Inference: methodology/consume-edge-inference.md
      - Propagation in Reporting: methodology/propagation-in-reporting.md
      - A2A Scanning: methodology/a2a-scanning.md
      - Threat Modeling: methodology/threat-modeling.md
  - Modules:
      - Agentic (ASI01-ASI10): agentic/README.md
      - MCP Architecture: mcp/ARCHITECTURE.md
      - MCP STDIO RCE: mcp/stdio-rce-writeup.md
  - Usage:
      - MQTT Scanning: usage/mqtt-scanning.md
      - ABFP Fingerprinting: usage/abfp-fingerprinting.md
      - Attack Scenarios: usage/attack-scenarios.md
      - Shell Completion: usage/shell-completion.md
  - Examples:
      - Environment Doctor: examples/01-environment-doctor.md
      - MCP STDIO RCE: examples/02-mcp-stdio-rce.md
      - ABFP Baseline: examples/03-abfp-baseline.md
      - Agentic Static Scan: examples/04-agentic-static.md
      - Bug Bounty Prep: examples/05-bug-bounty-prep.md
  - Security:
      - Supply Chain: SUPPLY-CHAIN.md
  - Reference:
      - CLI: reference/cli.md
      - API (auto): reference/api.md
      - API (manual): api/README.md
      - HCAP Spec: hcap-spec.md
