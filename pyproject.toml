[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mas_sentry --cov-report=term-missing --cov-report=html --cov-fail-under=70"

[tool.coverage.run]
source = ["mas_sentry"]
omit = ["*/tests/*", "setup.py"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
