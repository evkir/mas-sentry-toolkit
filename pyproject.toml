[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mas-sentry-toolkit"
version = "0.7.0"
description = "Unified offensive-security toolkit for Multi-Agent Systems: MQTT/AMQP IoT swarms and MCP/A2A LLM agents. Aligned with OWASP Agentic Top 10 (2026)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Evgeny Kiriyak", email = "ekiriyak@gmail.com" }]
keywords = ["security", "pentesting", "multi-agent-systems", "mqtt", "amqp", "mcp", "a2a", "owasp", "agentic-ai", "llm-security", "abfp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "paho-mqtt>=2.1",
    "pika>=1.3",
    "rich>=13.9",
    "typer>=0.15",
    "pydantic>=2.10",
    "jinja2>=3.1",
    "httpx>=0.28",
    "networkx>=3.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "structlog>=24.4",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63.1"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "pytest-asyncio>=0.25", "ruff>=0.16", "mypy>=1.13", "bandit>=1.8", "packaging>=24"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]
lab = ["pyyaml>=6.0", "a2a-sdk[http-server]>=1.1", "mcp>=2.0", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/evkir/mas-sentry-toolkit"
Repository = "https://github.com/evkir/mas-sentry-toolkit"
Issues = "https://github.com/evkir/mas-sentry-toolkit/issues"
Changelog = "https://github.com/evkir/mas-sentry-toolkit/blob/main/CHANGELOG.md"
Security = "https://github.com/evkir/mas-sentry-toolkit/blob/main/SECURITY.md"
"Threat Model" = "https://github.com/evkir/mas-sentry-toolkit/blob/main/THREAT_MODEL.md"

[project.scripts]
mas-sentry = "mas_sentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mas_sentry"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S105", "S107", "S110", "S310", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"lab/**" = ["S311", "S104"]
"scripts/**" = ["S607", "E402", "S603"]
"mas_sentry/cli/**" = ["B008"]

[tool.mypy]
# Matches the interpreter the lint job runs on, not the floor in
# requires-python: mypy parses installed third-party stubs with this
# grammar, and 3.12-only packages (numpy 2.5+ requires >=3.12) ship stubs
# using PEP 695 syntax that a lower target cannot parse. Compatibility with
# the 3.11 floor is covered by the test matrix, which runs 3.11 through 3.14.
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mas_sentry --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no network required)",
    "integration: integration tests (requires Docker lab)",
    "slow: tests that take more than 5 seconds",
]

[tool.coverage.report]
fail_under = 70
