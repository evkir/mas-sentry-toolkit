name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build dists + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine cyclonedx-bom
      - name: Build wheel + sdist
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Generate CycloneDX SBOM from locked deps
        run: |
          cyclonedx-py requirements requirements-lock.txt \
            --output-format JSON \
            --output-file dist/sbom.cyclonedx.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cyclonedx.json
          generate_release_notes: true
