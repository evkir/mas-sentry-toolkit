name: Supply Chain

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - requirements.txt
      - requirements-lock.txt
      - .github/workflows/supply-chain.yml
      - mas_sentry/agentic/**
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly Mon 06:17 UTC - catch new CVEs in unchanged deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-integrity:
    name: Lockfile hash-verified install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter requires-python admits. The lockfile is what ships
        # to users, and it was verified on 3.12 alone while pyproject promised
        # 3.11, so a pin that raised the floor installed cleanly here and broke
        # every 3.11 user with this job green. The networkx pin excludes 3.14.1
        # exactly; if setup-python ever resolves that patch, the failure is the
        # pin saying so, not anything this repository changed.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime deps with enforced hashes
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
      - name: Install package (no deps)
        run: pip install . --no-deps
      - name: Import smoke
        run: python -c "import mas_sentry; print(mas_sentry.__name__, 'ok')"

  vuln-audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit locked dependencies
        run: pip-audit -r requirements-lock.txt

  dogfood-supply-chain:
    name: Self-audit (mas-sentry supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Scan own lockfile for supply-chain risk
        run: |
          mkdir -p reports
          mas-sentry agentic scan \
            --target self-audit \
            --requirements requirements-lock.txt \
            --asi supply_chain \
            --out reports/self-audit-supply-chain.json
      - name: Gate on findings
        run: |
          python - reports/self-audit-supply-chain.json <<'EOF'
          import json, sys, pathlib
          findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if findings:
              print(f"::error::supply-chain self-audit found {len(findings)} finding(s)")
              for f in findings:
                  print(f"  - [{f['severity']}] {f['title']}")
              sys.exit(1)
          print("supply-chain self-audit clean: 0 findings")
          EOF
      - name: Upload self-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-audit-supply-chain-report
          path: reports/self-audit-supply-chain.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
